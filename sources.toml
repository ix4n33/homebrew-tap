[casks.animeko]
name = "Animeko"
desc = "Anime streaming client stable release"
homepage = "https://github.com/open-ani/animeko"
app = "Ani.app"

source.type = "github_release"
source.repo = "open-ani/animeko"
source.version_prefix = "v"

artifacts.arm.url = "https://github.com/open-ani/animeko/releases/download/v{version}/ani-{version}-macos-aarch64.dmg"
artifacts.arm.asset = "ani-{version}-macos-aarch64.dmg"
artifacts.arm.verified = "github.com/open-ani/animeko/"

[casks."animeko@beta"]
name = "Animeko Beta"
desc = "Anime streaming client beta release"
homepage = "https://github.com/open-ani/animeko"
app = "Ani.app"

source.type = "github_release"
source.repo = "open-ani/animeko"
source.version_prefix = "v"
source.version_match = '^\d+\.\d+\.\d+(\-beta\d*)?$'

artifacts.arm.url = "https://github.com/open-ani/animeko/releases/download/v{version}/ani-{version}-macos-aarch64.dmg"
artifacts.arm.asset = "ani-{version}-macos-aarch64.dmg"
artifacts.arm.verified = "github.com/open-ani/animeko/"

[casks."animeko@alpha"]
name = "Animeko Alpha"
desc = "Anime streaming client alpha release"
homepage = "https://github.com/open-ani/animeko"
app = "Ani.app"

source.type = "github_release"
source.repo = "open-ani/animeko"
source.version_prefix = "v"
source.version_match = '^\d+\.\d+\.\d+(\-(alpha|beta)\d*)?$'

artifacts.arm.url = "https://github.com/open-ani/animeko/releases/download/v{version}/ani-{version}-macos-aarch64.dmg"
artifacts.arm.asset = "ani-{version}-macos-aarch64.dmg"
artifacts.arm.verified = "github.com/open-ani/animeko/"

[casks.codex-plus-plus]
name = "Codex++"
desc = "Enhancement launcher and manager for Codex App"
homepage = "https://github.com/BigPizzaV3/CodexPlusPlus"
app = ["Codex++.app", "Codex++ 管理工具.app"]

source.type = "github_release"
source.repo = "BigPizzaV3/CodexPlusPlus"
source.version_prefix = "v"

artifacts.arm.url = "https://github.com/BigPizzaV3/CodexPlusPlus/releases/download/v{version}/CodexPlusPlus-{version}-macos-arm64.dmg"
artifacts.arm.asset = "CodexPlusPlus-{version}-macos-arm64.dmg"

[casks.sparkle]
name = "Sparkle"
desc = "Mihomo proxy client"
homepage = "https://github.com/xishang0128/sparkle"
pkg = "sparkle-macos-{version}-arm64.pkg"
macos = "monterey"

source.type = "github_release"
source.repo = "xishang0128/sparkle"

artifacts.arm.url = "https://github.com/xishang0128/sparkle/releases/download/{version}/sparkle-macos-{version}-arm64.pkg"
artifacts.arm.asset = "sparkle-macos-{version}-arm64.pkg"

uninstall.pkgutil = "sparkle.app"
